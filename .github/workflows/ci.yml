name: CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm run install:all

      - name: Run Server Unit Tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/nyc-dsa-arena-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-must-be-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-must-be-at-least-32-characters

      - name: Lint Verification
        run: npm run lint
        continue-on-error: true

  docker-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: test-and-verify
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config
